# Redis configuration for rate-limit state.
# Rate-limit state is short-lived and fully reconstructible, so durability is traded for latency.

bind 0.0.0.0
port 6379
# The container port is only published on the host's loopback interface (see docker-compose.yml),
# and the Compose network is private. Protected mode would otherwise refuse port-forwarded
# connections because no password is set.
protected-mode no

# --- Persistence: off ---
# A restart resets every client's quota (documented in docs/13-failure-handling.md).
# Snapshots/AOF would add fork/fsync latency without making limiting more correct.
save ""
appendonly no

# --- Memory ---
# Every rate-limit key has a TTL. volatile-ttl evicts the keys closest to expiry first and never
# touches keys without a TTL. A full Redis evicts nearly-expired counters instead of failing writes.
maxmemory 256mb
maxmemory-policy volatile-ttl

# Lua scripts are O(1) and finish in microseconds; anything slower than 5 ms is logged.
slowlog-log-slower-than 5000
slowlog-max-len 256

# Reclaim memory for expired/evicted keys in a background thread.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
