global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app1:8080"]
        labels: { instance: app-1 }
      - targets: ["app2:8080"]
        labels: { instance: app-2 }
      - targets: ["app3:8080"]
        labels: { instance: app-3 }

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { instance: redis }
