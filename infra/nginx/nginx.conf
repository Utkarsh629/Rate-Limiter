# Load balancer in front of the three application instances.
worker_processes 2;                 # the container is limited to 1 CPU; "auto" would see the host's cores
events { worker_connections 4096; }

http {
    log_format ratelimiter '$time_iso8601 $remote_addr "$request" $status $request_time '
                           'upstream=$upstream_addr upstream_time=$upstream_response_time "$http_user_agent"';
    access_log /dev/stdout ratelimiter;
    error_log /dev/stderr warn;

    server_tokens off;

    upstream app {
        # Static addresses (docker-compose.yml) so a restarted container keeps its slot.
        # Passive health: after a failed request the instance is skipped for 5 s (open-source Nginx has no
        # active health checks; Compose health checks gate start-up order only).
        server 172.28.0.11:8080 max_fails=1 fail_timeout=5s;
        server 172.28.0.12:8080 max_fails=1 fail_timeout=5s;
        server 172.28.0.13:8080 max_fails=1 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 8080;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Metrics and health are for Prometheus and Docker on the internal network only.
        location /actuator {
            return 404;
        }

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";                    # reuse upstream keepalive connections
            proxy_set_header Host $host;
            # Appends the connecting client; the apps trust only this Nginx's address (TRUSTED_PROXIES) and
            # take the right-most untrusted entry, so a client-supplied X-Forwarded-For cannot spoof its IP.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout;                 # retried on another instance (idempotent requests only)
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            # No X-Upstream response header (security review SEC-6): which instance served a request is recorded
            # only in the access log (upstream=...), which the smoke and benchmark tooling read.
        }
    }
}
