# Local development against `docker compose up -d redis mysql`.
# Activate with: ./mvnw spring-boot:run   (the Maven plugin enables the dev profile)

spring:
  config:
    # Read KEY=VALUE pairs from ./.env so the app and Docker Compose share one set of
    # local credentials. The file is git-ignored; .env.example is the template.
    import: optional:file:.env[.properties]
  datasource:
    # Compose MySQL publishes on MYSQL_HOST_PORT (3307 by default, to avoid clashing with a
    # locally installed MySQL). TLS is off for the local container only.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:${MYSQL_HOST_PORT:3307}}/${MYSQL_DATABASE:ratelimiter}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
  data:
    redis:
      port: ${REDIS_PORT:${REDIS_HOST_PORT:6379}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true                # /v3/api-docs
  swagger-ui:
    enabled: true                # /swagger-ui.html

ratelimiter:
  dev-endpoints:
    enabled: true                # POST /api/v1/auth/demo-token, GET /api/v1/demo/whoami
  policy:
    fallback-enabled: true       # dev only: start with these policies if MySQL is down at startup
    # Mirrors the Flyway V2 seed. Ids live in a separate range so their Redis state never mixes
    # with database policies' state.
    fallback-policies:
      - { id: 1000000001, name: fallback-anonymous,  endpoint-pattern: "/api/**", tier: ANONYMOUS,  key-by: IP,   algorithm: SLIDING_WINDOW, limit: 10,   window-ms: 60000 }
      - { id: 1000000002, name: fallback-free,       endpoint-pattern: "/api/**", tier: FREE,       key-by: USER, algorithm: TOKEN_BUCKET,   limit: 20,   window-ms: 60000 }
      - { id: 1000000003, name: fallback-premium,    endpoint-pattern: "/api/**", tier: PREMIUM,    key-by: USER, algorithm: TOKEN_BUCKET,   limit: 100,  window-ms: 60000 }
      - { id: 1000000004, name: fallback-enterprise, endpoint-pattern: "/api/**", tier: ENTERPRISE, key-by: USER, algorithm: TOKEN_BUCKET,   limit: 1000, window-ms: 60000 }
      - { id: 1000000005, name: fallback-demo-enterprise-endpoint, http-method: GET, endpoint-pattern: "/api/v1/demo/enterprise", tier: ENTERPRISE, key-by: USER, algorithm: SLIDING_WINDOW, limit: 50, window-ms: 60000, failure-mode: FAIL_CLOSED }
