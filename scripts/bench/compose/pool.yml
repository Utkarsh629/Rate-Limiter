# Phase 3B benchmark stack variant "pool-<n>" (B9 pooling only). Applied by scripts/bench/run.sh as an extra Compose
# file with REDIS_POOL_ENABLED=true and BENCH_POOL_MAX_ACTIVE=<n> in the environment; the main file is unchanged
# (it already passes REDIS_POOL_ENABLED through). The pool size uses the application's existing
# REDIS_POOL_MAX_ACTIVE setting (default 16).
services:
  app1:
    environment:
      REDIS_POOL_MAX_ACTIVE: ${BENCH_POOL_MAX_ACTIVE:-16}
  app2:
    environment:
      REDIS_POOL_MAX_ACTIVE: ${BENCH_POOL_MAX_ACTIVE:-16}
  app3:
    environment:
      REDIS_POOL_MAX_ACTIVE: ${BENCH_POOL_MAX_ACTIVE:-16}
